<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>The End — Exit Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://unpkg.com">
<style>
  :root {
    --spin-speed: 26s;       /* idle rotation (calm) */
    --ease-toon: cubic-bezier(.34, 1.56, .64, 1);   /* bouncy cartoon overshoot */
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    overflow: hidden;
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    background: #000;
  }

  /* ---------- Theme surfaces (bg matches each image's background) ---------- */
  [data-theme="dark"]  { --bg: #000000; --ink: #ffffff; --ink-soft: rgba(255,255,255,.65); --accent: #e3251c; --line: #111; --soft-shadow: rgba(255,255,255,.35); --swirl-bg:#000000; --swirl-line:#e3251c; --swirl-alt:rgba(255,255,255,.12); }
  [data-theme="light"] { --bg: #ffffff; --ink: #141414; --ink-soft: rgba(0,0,0,.6);        --accent: #d81e16; --line: #111; --soft-shadow: rgba(0,0,0,.22); --swirl-bg:#ffffff; --swirl-line:#d81e16; --swirl-alt:rgba(0,0,0,.10); }

  .stage {
    position: fixed;
    inset: 0;
    background: var(--bg);
    transition: background .8s ease;
    display: grid;
    place-items: center;
    overflow: hidden;
  }

  /* ---------- Full-screen spinning spiral ---------- */
  .vortex {
    position: absolute;
    inset: 0;
    transform-origin: center;
    will-change: transform;
  }

  .spiral {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 160vmax;          /* square SVG, oversized so the corners stay covered at every rotation angle */
    height: 160vmax;
    transform-origin: center;
    pointer-events: none;
    user-select: none;
    -webkit-user-drag: none;
    will-change: transform;       /* own GPU layer → buttery rotation */
    backface-visibility: hidden;
    animation: spin var(--spin-speed) linear infinite;
  }

  /* The spiral is a single inline-SVG vector: it paints INSTANTLY (no image
     download/decode — the old high_quality PNGs were ~3.3 MB each, loaded for
     BOTH themes), stays razor-sharp at any zoom (so the dive no longer blurs),
     and recolours per theme via the CSS vars below — so flipping the theme no
     longer swaps a heavy bitmap (that was the toggle stutter). */
  .swirl-bg   { fill:   var(--swirl-bg); }
  .swirl-line { stroke: var(--swirl-line); }
  .swirl-alt  { stroke: var(--swirl-alt); }

  @keyframes spin {
    from { transform: translate(-50%,-50%) rotate(0deg);   }
    to   { transform: translate(-50%,-50%) rotate(360deg);  }
  }

  /* ---------- Center portal content ---------- */
  .portal {
    position: relative;
    z-index: 5;
    text-align: center;
    color: var(--ink);
    transition: transform 1.2s var(--ease-toon), opacity .6s ease;
    will-change: transform, opacity;
  }
  .kicker {
    text-transform: uppercase;
    letter-spacing: .5em;
    font-size: clamp(.6rem, 1.6vw, .85rem);
    color: #fff;
    mix-blend-mode: difference;
    margin-bottom: 1.4rem;
    padding-left: .5em;
  }
  .exit-btn {
    padding: 1rem 2.6rem;
    font-size: clamp(.9rem, 1.9vw, 1.1rem);
    font-weight: 800;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: #fff;
    background: var(--accent);
    border: 4px solid #111;
    border-radius: 999px;
    cursor: pointer;
    box-shadow: 6px 6px 0 #111;           /* chunky cartoon shadow */
    transition: transform .12s ease, box-shadow .12s ease;
  }
  .exit-btn:hover  { transform: translate(-2px,-2px); box-shadow: 9px 9px 0 #111; }
  .exit-btn:active { transform: translate(4px,4px);   box-shadow: 1px 1px 0 #111; }

  /* ---------- Theme toggle ---------- */
  .theme-toggle {
    position: fixed;
    top: 1.3rem;
    right: 1.3rem;
    z-index: 20;
    width: 46px; height: 46px;
    border-radius: 50%;
    border: 3px solid #111;
    background: var(--bg);
    color: var(--ink);
    font-size: 1.1rem;
    cursor: pointer;
    display: grid;
    place-items: center;
    box-shadow: 3px 3px 0 #111;
    transition: transform .3s ease;
  }
  .theme-toggle:hover { transform: rotate(180deg) scale(1.08); }

  /* ---------- Cartoon "going out" dive ---------- */
  .stage.diving { cursor: none; }

  /* spiral: anticipation wind-up, then whoosh-zoom into the vortex */
  .stage.diving .vortex { animation: dive 1.5s cubic-bezier(.55,0,.75,0) forwards; }
  .stage.diving .spiral { animation-duration: .9s; }
  @keyframes dive {
    0%   { transform: scale(1)    rotate(0deg);   }
    12%  { transform: scale(1.03) rotate(-18deg); }   /* wind-up (never shrinks below full cover) */
    100% { transform: scale(2.8)  rotate(320deg); }   /* gentle zoom — a big scale upscales the bitmap and blurs it */
  }
  /* portal text gets sucked into the center */
  .stage.diving .portal { transform: scale(.04); opacity: 0; }

  /* ---------- Iris-out (the classic cartoon circle that closes shut) ----------
     A radial-gradient is a PERFECT circle on every frame. The old technique
     (box-shadow + animating width/height with border-radius:50%) drew a
     rounded-RECTANGLE mid-animation in Chromium. --iris-r animates via
     @property so the gradient's radius interpolates smoothly. */
  @property --iris-r {
    syntax: "<length>";
    inherits: false;
    initial-value: 80vmax;
  }
  .iris {
    position: fixed;
    inset: 0;
    z-index: 14;
    pointer-events: none;
    opacity: 0;
    background: radial-gradient(circle at 50% 50%,
                transparent var(--iris-r),
                var(--bg) calc(var(--iris-r) + 2px));   /* clear hole, theme-bg outside */
  }
  .stage.diving .iris {
    opacity: 1;
    animation: irisClose 1.5s cubic-bezier(.7,0,.84,0) forwards;
  }
  @keyframes irisClose {
    0%   { --iris-r: 80vmax; }   /* open wider than any screen corner (~71vmax) → full reveal */
    100% { --iris-r: 0vmax;  }   /* closed to a single point */
  }

  /* ---------- Final cartoon "THE END" page (always dark = the contact page) ---------- */
  .final {
    position: fixed;
    inset: 0;
    z-index: 16;
    display: grid;
    place-content: center;
    justify-items: center;
    text-align: center;
    gap: 1.2rem;
    background: var(--bg);        /* the last page follows the active theme (light / dark) */
    color: var(--ink);
    opacity: 0;
    visibility: hidden;
    cursor: none;                 /* replaced by the red "Contact-Click" badge */
    transition: background .8s ease;
  }
  .final.show { animation: fadeBg .4s ease forwards; }
  @keyframes fadeBg { to { opacity: 1; visibility: visible; } }

  .final-title {
    font-family: "Comic Sans MS", "Chalkboard SE", system-ui, sans-serif;
    font-weight: 900;
    font-size: clamp(3.5rem, 17vw, 12rem);
    line-height: .9;
    color: var(--accent);
    -webkit-text-stroke: clamp(3px, 1vw, 8px) var(--ink);  /* outline follows the theme so it pops in both */
    paint-order: stroke fill;
    text-shadow: 8px 8px 0 var(--soft-shadow);        /* bold offset comic shadow */
    transform: rotate(-4deg);
    transition: transform .3s ease-out;               /* smooth lean toward the mouse */
  }
  .final.show .final-title { animation: popIn .6s var(--ease-toon) .12s backwards; }
  @keyframes popIn {
    from { transform: rotate(-4deg) scale(0);   }
    to   { transform: rotate(-4deg) scale(1);   }
  }

  .final-sub {
    font-family: "Comic Sans MS", "Chalkboard SE", system-ui, sans-serif;
    font-size: clamp(1rem, 3.2vw, 1.6rem);
    font-weight: 700;
    color: var(--ink-soft);
  }
  .final.show .final-sub { animation: popIn .5s var(--ease-toon) .32s backwards; }

  .final-hint {
    font-size: clamp(.88rem, 2.2vw, 1.05rem);
    letter-spacing: .24em;
    text-transform: uppercase;
    font-weight: 600;
    color: #fff;
    mix-blend-mode: difference;
    font-family: "Bebas Neue", "Segoe UI", system-ui, sans-serif;
  }
  .final.show .final-hint { animation: popIn .5s var(--ease-toon) .42s backwards; }

  .back-btn {
    margin-top: .4rem;
    padding: .85rem 2.2rem;
    border-radius: 999px;
    border: 3px solid var(--ink);
    background: var(--bg);
    color: var(--ink);
    font-weight: 800;
    letter-spacing: .08em;
    text-transform: uppercase;
    cursor: none;
    transition: transform .15s ease, opacity .3s ease;
  }
  .final.show .back-btn { animation: popIn .5s var(--ease-toon) .52s backwards; }
  .back-btn:hover  { transform: translate(-2px,-2px); }
  .back-btn:active { transform: translate(3px,3px);   }
  .back-btn.merging { transform: scale(0) !important; opacity: 0 !important; pointer-events: none; }

  .back-btn.primary { background: var(--accent); color: #fff; border-color: var(--ink); }

  .final-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 1rem;
    justify-content: center;
  }

  /* ---------- Custom "Contact-Click" cursor (red · white text · black border) ---------- */
  .contact-cursor {
    position: fixed;
    top: 0; left: 0;
    z-index: 30;
    transform: translate(-50%, -50%);
    padding: .55rem 1rem;
    background: var(--accent);       /* red   */
    color: #fff;                     /* white */
    border: 2px solid #111;          /* black border */
    border-radius: 999px;
    font-weight: 800;
    font-size: .82rem;
    letter-spacing: .03em;
    white-space: nowrap;
    box-shadow: 2px 2px 0 #111;
    pointer-events: none;
    opacity: 0;
    transition: opacity .2s ease, transform .08s ease;
  }
  .contact-cursor.show { opacity: 1; }
  .contact-cursor.tap  { transform: translate(-50%, -50%) scale(.85); }

  /* ---------- RYD-branded full-screen reveal on "Reopen Site" hover ---------- */
  .dream-orb {
    position: fixed;
    left: 50%; top: 50%;
    width: 144vmax; height: 144vmax;
    border-radius: 50%;
    pointer-events: none;
    transform: translate(-50%, -50%) scale(0);
    transition: transform 0.18s ease-in;
    z-index: 17;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1rem;
    will-change: transform;
  }
  [data-theme="dark"]  .dream-orb { background: #000000; border: 3px solid #ffffff; }
  [data-theme="light"] .dream-orb { background: #ffffff; border: 3px solid #111111; }
  .dream-orb.show {
    transform: translate(-50%, -50%) scale(1);
  }
  .dream-orb::before {
    content: "";
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 55vmin; height: 55vmin;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,45,45,.2) 0%, transparent 68%);
    pointer-events: none;
    flex-shrink: 0;
  }
  .dream-label {
    font-family: "Bebas Neue", system-ui, sans-serif;
    font-size: clamp(6rem, 20vw, 15rem);
    letter-spacing: 6px;
    line-height: 0.88;
    color: #ff2d2d;
    pointer-events: none;
    animation: dreamFloat 3.5s ease-in-out infinite;
  }
  .dream-sub {
    font-family: "Bebas Neue", system-ui, sans-serif;
    font-size: clamp(1rem, 3vw, 1.6rem);
    letter-spacing: .35em;
    text-transform: uppercase;
    pointer-events: none;
    animation: dreamFloat 3.5s ease-in-out infinite .4s;
  }
  [data-theme="dark"]  .dream-sub { color: rgba(255,255,255,.55); }
  [data-theme="light"] .dream-sub { color: rgba(0,0,0,.45); }
  @keyframes dreamFloat {
    0%,100% { transform: translateY(0); }
    50%      { transform: translateY(-10px); }
  }

  /* ---------- Accessibility: calm it right down ---------- */
  @media (prefers-reduced-motion: reduce) {
    .spiral { animation-duration: 80s; }
    .stage.diving .vortex { animation: none; transform: scale(2); opacity: 0; transition: all .9s ease; }
    .stage.diving .iris { animation: none; opacity: 1; --iris-r: 0vmax; transition: opacity .6s ease; }
  }
</style>
</head>

    <div class="portal" id="portal">
      <p class="kicker">You've reached the end</p>
      <button class="exit-btn" id="exitBtn">Take the Exit Portal &nbsp;&rarr;</button>
    </div>

    <div class="iris"></div>
    <div class="dream-orb" id="dreamOrb" aria-hidden="true">
      <span class="dream-label">RYD.</span>
      <span class="dream-sub">Back to the Site</span>
    </div>

    <section class="final" id="final" aria-hidden="true">
      <h1 class="final-title">THE&nbsp;END</h1>
      <p class="final-sub">That's all, folks!</p>
      <p class="final-hint">Click anywhere to message me on WhatsApp&nbsp;&rarr;</p>
      <div class="final-actions">
        <button class="back-btn primary" id="reopenBtn" style="cursor: zoom-in;">&#8635;&nbsp; Reopen Site</button>
      </div>
    </section>

    <button class="theme-toggle" id="themeBtn" title="Toggle light / dark" aria-label="Toggle theme">◑</button>

    <div class="contact-cursor" id="contactCursor" aria-hidden="true">Contact-Click</div>
  </main>

  <script>
    const root          = document.documentElement;
    const stage         = document.getElementById('stage');
    const exitBtn       = document.getElementById('exitBtn');
    const dreamOrb      = document.getElementById('dreamOrb');
    const themeBtn      = document.getElementById('themeBtn');
    const reopenBtn     = document.getElementById('reopenBtn');
    const contactCursor = document.getElementById('contactCursor');
    const final         = document.getElementById('final');
    const finalTitle    = document.querySelector('.final-title');

    /* ===== Theme — stay in sync with the main site =====
       The portfolio stores its choice in localStorage('ryd-theme').
       Adopt it on load so light/dark carries over instead of resetting. */
    const THEME_KEY = 'ryd-theme';
    const savedTheme = localStorage.getItem(THEME_KEY);
    if (savedTheme === 'light' || savedTheme === 'dark') root.dataset.theme = savedTheme;

    /* ===== WhatsApp contact =====
       Set your number below — country code first, digits only (no +, spaces or dashes).
       e.g. Bangladesh 01712-345678  ->  '8801712345678' */
    const WHATSAPP_NUMBER = '601112778527';   // +60 11 1277 8527
    const WHATSAPP_TEXT   = encodeURIComponent("Hi Riyad! I just came through your portfolio's exit portal 👋");
    const whatsappURL     = () => 'https://wa.me/' + WHATSAPP_NUMBER + '?text=' + WHATSAPP_TEXT;

    // The red "Contact-Click" badge follows the pointer — and "THE END" leans
    // toward whichever side the mouse is on (CSS transition animates the lean).
    document.addEventListener('mousemove', (e) => {
      contactCursor.style.left = e.clientX + 'px';
      contactCursor.style.top  = e.clientY + 'px';

      const nx = (e.clientX / window.innerWidth  - 0.5) * 2;   // -1 (left) … 1 (right)
      const ny = (e.clientY / window.innerHeight - 0.5) * 2;   // -1 (top)  … 1 (bottom)
      finalTitle.style.transform =
        'rotate(' + (nx * 12).toFixed(2) + 'deg) translate(' +
        (nx * 18).toFixed(1) + 'px,' + (ny * 10).toFixed(1) + 'px)';
    });

    // dark.png for dark theme, light.png for light theme — and remember the choice
    themeBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      const next = root.dataset.theme === 'dark' ? 'light' : 'dark';
      root.dataset.theme = next;
      localStorage.setItem(THEME_KEY, next);
    });

    // Cartoon dive into the exit portal
    let diving = false;
    exitBtn.addEventListener('click', () => {
      if (diving) return;
      diving = true;
      stage.classList.add('diving');
      // reveal the END / contact page just as the iris finishes closing
      setTimeout(() => {
        final.classList.add('show');
        final.setAttribute('aria-hidden', 'false');
        contactCursor.classList.add('show');     // red "Contact-Click" badge appears
      }, 1450);
    });

    // Reopen Site — slow reveal on hover-in, fast collapse on hover-out
    reopenBtn.addEventListener('mouseenter', () => {
      dreamOrb.style.transition = 'transform 1.4s cubic-bezier(0.16, 1, 0.3, 1)';
      dreamOrb.classList.add('show');
    });
    reopenBtn.addEventListener('mouseleave', () => {
      dreamOrb.style.transition = 'transform 0.18s ease-in';
      dreamOrb.classList.remove('show');
    });
    reopenBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      window.location.replace('../../index.html');
    });

    // Click anywhere on the dark END page → open WhatsApp (the buttons above opt out)
    final.addEventListener('click', () => {
      contactCursor.classList.add('tap');
      setTimeout(() => contactCursor.classList.remove('tap'), 150);
      window.open(whatsappURL(), '_blank', 'noopener');
    });
  </script>
</body>
</html>
