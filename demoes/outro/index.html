<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Exit Portal — RYD.</title>

<!-- Fonts: match main site exactly -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="preconnect" href="https://api.fontshare.com" crossorigin />
<link href="https://api.fontshare.com/v2/css?f[]=chillax@300,400,500,600,700&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Bitcount+Grid+Double&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
<!-- Phosphor icons (same as main site) -->
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/light/style.css" />

<style>
  /* ============================================================
     Exit Portal — styled to match RYD main site aesthetic
     Bebas Neue (display) · Chillax (body) · Bitcount (mono)
     White × Red × Black · editorial / glass
  ============================================================ */

  /* ---------- CSS variables (mirror main site exactly) ---------- */
  :root {
    --red:       #ff2d2d;
    --red-deep:  #d40f12;
    --red-soft:  rgba(255, 45, 45, 0.14);
    --radius:    20px;
    --radius-sm: 12px;
    --ease:      cubic-bezier(0.16, 1, 0.3, 1);
    --ease-out:  cubic-bezier(0.22, 1, 0.36, 1);
    --font-display: "Bebas Neue", "Arial Narrow", sans-serif;
    --font-body:    "Chillax", "Inter", -apple-system, system-ui, sans-serif;
    --font-mono:    "Bitcount Grid Double", "Bebas Neue", ui-monospace, monospace;
    --font-serif:   "Instrument Serif", Georgia, serif;
    --spin-speed: 26s;
  }

  [data-theme="dark"] {
    --bg:         #000000;
    --bg-soft:    #0a0a0a;
    --text:       #ffffff;
    --text-soft:  rgba(255,255,255,0.66);
    --text-dim:   rgba(255,255,255,0.42);
    --surface:    rgba(255,255,255,0.035);
    --surface-2:  rgba(255,255,255,0.07);
    --border:     rgba(255,255,255,0.13);
    --border-soft:rgba(255,255,255,0.07);
    --shadow:     0 30px 70px rgba(0,0,0,0.6);
    --glow-op:    0.45;
    --swirl-bg:   #000000;
    --swirl-line: #ff2d2d;
    --swirl-alt:  rgba(255,255,255,0.12);
  }
  [data-theme="light"] {
    --bg:         #ffffff;
    --bg-soft:    #f3f3f3;
    --text:       #0a0a0a;
    --text-soft:  rgba(0,0,0,0.66);
    --text-dim:   rgba(0,0,0,0.46);
    --surface:    rgba(0,0,0,0.025);
    --surface-2:  rgba(0,0,0,0.05);
    --border:     rgba(0,0,0,0.16);
    --border-soft:rgba(0,0,0,0.09);
    --shadow:     0 30px 60px rgba(0,0,0,0.16);
    --glow-op:    0.18;
    --swirl-bg:   #ffffff;
    --swirl-line: #ff2d2d;
    --swirl-alt:  rgba(0,0,0,0.10);
  }

  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%; overflow: hidden;
    font-family: var(--font-body);
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    transition: background 0.5s var(--ease), color 0.5s var(--ease);
  }
  ::selection { background: var(--red); color: #fff; }

  /* ---------- Stage ---------- */
  .stage {
    position: fixed; inset: 0;
    background: var(--bg);
    display: grid;
    place-items: center;
    overflow: hidden;
    transition: background 0.8s var(--ease);
  }

  /* ---------- Spiral ---------- */
  .vortex {
    position: absolute; inset: 0;
    transform-origin: center;
    will-change: transform;
  }
  .spiral {
    position: absolute; top: 50%; left: 50%;
    width: 160vmax; height: 160vmax;
    transform-origin: center; pointer-events: none;
    user-select: none; -webkit-user-drag: none;
    will-change: transform; backface-visibility: hidden;
    animation: spin var(--spin-speed) linear infinite;
  }
  .swirl-bg   { fill:   var(--swirl-bg); }
  .swirl-line { stroke: var(--swirl-line); }
  .swirl-alt  { stroke: var(--swirl-alt); }
  @keyframes spin {
    from { transform: translate(-50%,-50%) rotate(0deg); }
    to   { transform: translate(-50%,-50%) rotate(360deg); }
  }

  /* ---------- Background noise + grid (matches main site) ---------- */
  .bg-grid {
    position: absolute; inset: 0; z-index: 0; pointer-events: none;
    background-image:
      linear-gradient(rgba(255,255,255,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.04) 1px, transparent 1px);
    background-size: 64px 64px;
    mask-image: radial-gradient(ellipse 90% 70% at 50% 0%, #000 35%, transparent 78%);
    -webkit-mask-image: radial-gradient(ellipse 90% 70% at 50% 0%, #000 35%, transparent 78%);
    opacity: 0;
    transition: opacity 0.8s var(--ease);
  }
  [data-theme="light"] .bg-grid {
    background-image:
      linear-gradient(rgba(0,0,0,0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,0,0,0.05) 1px, transparent 1px);
  }
  .final.show ~ .bg-grid,
  .bg-grid.show { opacity: 1; }

  /* ---------- Portal (entry screen) ---------- */
  .portal {
    position: relative; z-index: 5;
    text-align: center;
    transition: transform 1.2s var(--ease), opacity 0.6s var(--ease);
    will-change: transform, opacity;
    display: flex; flex-direction: column; align-items: center; gap: 20px;
  }

  /* Eyebrow kicker */
  .kicker {
    display: inline-flex; align-items: center; gap: 10px;
    font-family: var(--font-serif); font-style: italic; font-size: 1.1rem;
    color: var(--text-soft); letter-spacing: 0.2px;
  }
  .kicker::before {
    content: ""; display: block; width: 32px; height: 1.5px;
    background: var(--red);
  }
  .kicker::after {
    content: ""; display: block; width: 32px; height: 1.5px;
    background: var(--red);
  }

  /* "Take the Exit Portal" button — styled like main site .btn--primary */
  .exit-btn {
    display: inline-flex; align-items: center; gap: 10px;
    font-family: var(--font-display);
    font-size: clamp(1.2rem, 3.5vw, 1.8rem);
    letter-spacing: 2px; text-transform: uppercase;
    color: #fff; padding: 16px 44px;
    background: var(--red); border: none; border-radius: 99px;
    cursor: pointer;
    box-shadow: 0 14px 40px rgba(255,45,45,0.35);
    transition: transform 0.3s var(--ease), box-shadow 0.3s var(--ease);
    touch-action: manipulation; position: relative; overflow: hidden;
  }
  .exit-btn::before {
    content: ""; position: absolute; inset: 0;
    background: rgba(255,255,255,0.1);
    opacity: 0; transition: opacity 0.3s;
  }
  .exit-btn:hover { transform: translateY(-3px); box-shadow: 0 20px 50px rgba(255,45,45,0.5); }
  .exit-btn:hover::before { opacity: 1; }
  .exit-btn:active { transform: translateY(1px); box-shadow: 0 8px 24px rgba(255,45,45,0.35); }
  .exit-btn i { font-size: 1.2rem; transition: transform 0.3s var(--ease); }
  .exit-btn:hover i { transform: translateX(4px); }

  /* ---------- Iris close (unchanged logic) ---------- */
  @property --iris-r {
    syntax: "<length>";
    inherits: false;
    initial-value: 80vmax;
  }
  .iris {
    position: fixed; inset: 0; z-index: 14;
    pointer-events: none; opacity: 0;
    background: radial-gradient(circle at 50% 50%,
        transparent var(--iris-r),
        var(--bg) calc(var(--iris-r) + 2px));
  }
  .stage.diving .iris {
    opacity: 1;
    animation: irisClose 1.5s cubic-bezier(.7,0,.84,0) forwards;
  }
  @keyframes irisClose {
    0%   { --iris-r: 80vmax; }
    100% { --iris-r: 0vmax; }
  }

  /* Dive animation */
  .stage.diving { cursor: none; }
  .stage.diving .vortex { animation: dive 1.5s cubic-bezier(.55,0,.75,0) forwards; }
  .stage.diving .spiral { animation-duration: .9s; }
  @keyframes dive {
    0%   { transform: scale(1)    rotate(0deg);   }
    12%  { transform: scale(1.03) rotate(-18deg); }
    100% { transform: scale(2.8)  rotate(320deg); }
  }
  .stage.diving .portal { transform: scale(.04); opacity: 0; }

  /* ---------- Final "THE END" screen ---------- */
  .final {
    position: fixed; inset: 0; z-index: 16;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; gap: 0;
    background: var(--bg);
    opacity: 0; visibility: hidden;
    cursor: none;
    transition: background 0.8s var(--ease);
  }
  .final.show { animation: fadeBg 0.4s var(--ease) forwards; }
  @keyframes fadeBg { to { opacity: 1; visibility: visible; } }

  /* Glass card wrapping the final content */
  .final-card {
    position: relative;
    background: var(--surface); border: 1.5px solid var(--border);
    border-radius: var(--radius); padding: clamp(32px,6vw,64px) clamp(28px,7vw,72px);
    max-width: min(600px, 90vw);
    width: 100%;
    display: flex; flex-direction: column; align-items: center; gap: 18px;
    box-shadow: var(--shadow);
    overflow: hidden;
  }
  .final-card::before {
    content: ""; position: absolute; top: 0; left: 0; right: 0; height: 3px;
    background: var(--red);
  }
  [data-theme="light"] .final-card {
    box-shadow: 0 2px 16px rgba(0,0,0,0.08), 0 30px 60px rgba(0,0,0,0.1);
    background: rgba(0,0,0,0.028);
  }

  .final.show .final-card { animation: cardIn 0.7s var(--ease) 0.18s backwards; }
  @keyframes cardIn {
    from { transform: translateY(28px) scale(0.96); opacity: 0; }
    to   { transform: translateY(0) scale(1); opacity: 1; }
  }

  /* Eyebrow in final card */
  .final-eyebrow {
    display: inline-flex; align-items: center; gap: 10px;
    font-family: var(--font-serif); font-style: italic;
    font-size: 1rem; color: var(--text-dim); letter-spacing: 0.2px;
  }
  .final-eyebrow-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--red); flex-shrink: 0; }

  /* THE END headline */
  .final-title {
    font-family: var(--font-display);
    font-size: clamp(4rem, 16vw, 9rem);
    line-height: 0.88; letter-spacing: 3px;
    color: var(--red);
    text-transform: uppercase;
    transition: letter-spacing 0.5s var(--ease);
  }
  .final-title:hover { letter-spacing: 6px; }

  .final-sub {
    font-family: var(--font-serif); font-style: italic;
    font-size: clamp(1rem, 2.8vw, 1.3rem);
    color: var(--text-soft); margin-top: -4px;
  }

  /* Divider */
  .final-divider {
    width: 100%; height: 1.5px;
    background: var(--border);
    margin: 4px 0;
  }

  .final-hint {
    font-family: var(--font-body); font-size: 0.82rem;
    letter-spacing: 2px; text-transform: uppercase;
    color: var(--text-dim); font-weight: 500;
  }

  .final-actions {
    display: flex; flex-wrap: wrap; gap: 12px; justify-content: center;
    width: 100%; margin-top: 4px;
  }

  /* Shared button base for final screen — matches main site .btn */
  .final-btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 9px;
    font-family: var(--font-body); font-weight: 600;
    font-size: 0.9rem; letter-spacing: 0.2px;
    padding: 14px 28px; border-radius: 99px;
    cursor: none; transition: transform 0.25s var(--ease), box-shadow 0.3s;
    white-space: nowrap; position: relative; overflow: hidden;
    touch-action: manipulation; flex: 1; min-width: 140px;
  }
  .final-btn i { font-size: 1.05rem; transition: transform 0.3s var(--ease); }
  .final-btn--primary { background: var(--red); color: #fff; border: none;
    box-shadow: 0 8px 24px rgba(255,45,45,0.3); }
  .final-btn--primary:hover { box-shadow: 0 14px 36px rgba(255,45,45,0.45); transform: translateY(-2px); }
  .final-btn--primary:hover i { transform: translateX(3px); }
  .final-btn--ghost { background: transparent; color: var(--text); border: 1.5px solid var(--border); }
  .final-btn--ghost:hover { border-color: var(--text); transform: translateY(-2px); }
  .final-btn--ghost:hover i { transform: rotate(360deg); }

  /* WhatsApp button: hidden on desktop, visible only on touch/mobile */
  .wa-btn { display: none; }
  @media (hover: none) and (pointer: coarse) {
    .wa-btn { display: inline-flex; }
  }

  .final.show .final-btn { animation: btnIn 0.45s var(--ease) 0.5s backwards; }
  .final.show .final-btn:nth-child(2) { animation-delay: 0.62s; }
  @keyframes btnIn {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ---------- Custom cursor — "Contact" pill (desktop only) ---------- */
  .contact-cursor {
    position: fixed; top: 0; left: 0; z-index: 30;
    transform: translate(-50%,-50%);
    padding: .55rem 1.1rem;
    background: var(--red); color: #fff;
    border: 1.5px solid rgba(255,255,255,0.2);
    border-radius: 99px; font-family: var(--font-display);
    font-size: .82rem; letter-spacing: 2px; text-transform: uppercase;
    white-space: nowrap;
    box-shadow: 0 6px 18px rgba(255,45,45,0.4);
    pointer-events: none; opacity: 0;
    transition: opacity .2s var(--ease), transform .08s var(--ease);
  }
  .contact-cursor.show { opacity: 1; }
  .contact-cursor.tap  { transform: translate(-50%,-50%) scale(.85); }
  /* Hidden on touch devices */
  @media (hover: none) and (pointer: coarse) {
    .contact-cursor { display: none !important; }
  }

  /* ---------- Dream Orb (Reopen Site hover reveal) ---------- */
  .dream-orb {
    position: fixed; left: 50%; top: 50%;
    width: 144vmax; height: 144vmax;
    border-radius: 50%; pointer-events: none;
    transform: translate(-50%,-50%) scale(0);
    z-index: 17; overflow: hidden;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 16px;
    will-change: transform;
    border: 1.5px solid var(--border);
    background: var(--bg);
    /* Slow, smooth expansion — 40% of original speed → 2.5× longer */
    transition: transform 3.5s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .dream-orb::before {
    content: ""; position: absolute; top: 50%; left: 50%;
    transform: translate(-50%,-50%);
    width: 55vmin; height: 55vmin; border-radius: 50%;
    background: radial-gradient(circle, rgba(255,45,45,.2) 0%, transparent 68%);
    pointer-events: none;
  }
  .dream-orb.show {
    transform: translate(-50%,-50%) scale(1);
  }
  .dream-orb.collapsing {
    transition: transform 0.45s cubic-bezier(0.55, 0, 0.75, 0) !important;
  }
  .dream-label {
    font-family: var(--font-display);
    font-size: clamp(6rem, 20vw, 15rem);
    letter-spacing: 6px; line-height: 0.88;
    color: var(--red); pointer-events: none;
    animation: dreamFloat 3.5s var(--ease) infinite;
  }
  .dream-sub {
    font-family: var(--font-display);
    font-size: clamp(1rem, 3vw, 1.8rem);
    letter-spacing: 6px; text-transform: uppercase;
    color: var(--text-soft); pointer-events: none;
    animation: dreamFloat 3.5s var(--ease) infinite 0.4s;
  }
  @keyframes dreamFloat {
    0%,100% { transform: translateY(0); }
    50%      { transform: translateY(-12px); }
  }

  /* ---------- Theme toggle (matches main site style) ---------- */
  .theme-toggle {
    position: fixed; top: 22px; right: 22px; z-index: 20;
    display: grid; place-items: center;
    width: 42px; height: 42px; border-radius: 50%;
    border: 1.5px solid var(--border);
    background: var(--bg); color: var(--text);
    font-size: 1.1rem; cursor: pointer;
    transition: border-color 0.3s, transform 0.45s var(--ease);
    touch-action: manipulation;
  }
  .theme-toggle:hover { border-color: var(--red); transform: rotate(180deg); }

  /* ---------- Scroll progress bar (aesthetic detail) ---------- */
  .portal-logo {
    position: fixed; top: 22px; left: 28px; z-index: 20;
    font-family: var(--font-display); font-size: 1.6rem; letter-spacing: 2px;
    color: var(--text-dim);
    transition: color 0.3s;
  }
  .portal-logo span { color: var(--red); }
  .portal-logo:hover { color: var(--text); }

  /* ---------- Mobile layout ---------- */
  @media (max-width: 600px) {
    .final-card { padding: 28px 20px; gap: 14px; }
    .final-actions { flex-direction: column; align-items: stretch; }
    .final-btn { flex: unset; width: 100%; }
    .final-title { font-size: clamp(3.2rem, 18vw, 7rem); }
    .exit-btn { padding: 14px 32px; }
  }

  /* ---------- Reduced motion ---------- */
  @media (prefers-reduced-motion: reduce) {
    .spiral { animation-duration: 80s; }
    .stage.diving .vortex { animation: none; transform: scale(2); opacity: 0; transition: all .9s ease; }
    .stage.diving .iris { animation: none; opacity: 1; --iris-r: 0vmax; }
    .dream-label, .dream-sub { animation: none; }
  }
</style>
</head>

  <script>
    const root          = document.documentElement;
    const stage         = document.getElementById('stage');
    const exitBtn       = document.getElementById('exitBtn');
    const dreamOrb      = document.getElementById('dreamOrb');
    const themeBtn      = document.getElementById('themeBtn');
    const iconMoon      = document.getElementById('iconMoon');
    const iconSun       = document.getElementById('iconSun');
    const reopenBtn     = document.getElementById('reopenBtn');
    const waBtn         = document.getElementById('waBtn');
    const contactCursor = document.getElementById('contactCursor');
    const final         = document.getElementById('final');
    const finalTitle    = document.querySelector('.final-title');

    /* ── Touch detection ── */
    const isTouchDevice = !window.matchMedia('(pointer:fine)').matches;

    /* ── Theme: stay in sync with main site ── */
    const THEME_KEY = 'ryd-theme';
    function applyTheme(t) {
      root.dataset.theme = t;
      try { localStorage.setItem(THEME_KEY, t); } catch(e) {}
      // sync moon/sun icons
      if (t === 'light') { iconMoon.style.display = 'none'; iconSun.style.display = ''; }
      else                { iconSun.style.display  = 'none'; iconMoon.style.display = ''; }
    }
    const savedTheme = localStorage.getItem(THEME_KEY);
    if (savedTheme === 'light' || savedTheme === 'dark') applyTheme(savedTheme);
    else applyTheme('dark');

    themeBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      applyTheme(root.dataset.theme === 'dark' ? 'light' : 'dark');
    });

    /* ── WhatsApp ── */
    const WHATSAPP_NUMBER = '601112778527';
    const WHATSAPP_TEXT   = encodeURIComponent("Hi Riyad! I just came through your portfolio's exit portal 👋");
    const whatsappURL     = () => 'https://wa.me/' + WHATSAPP_NUMBER + '?text=' + WHATSAPP_TEXT;

    /* ── Custom cursor badge follows mouse (desktop only) ── */
    if (!isTouchDevice) {
      document.addEventListener('mousemove', (e) => {
        contactCursor.style.left = e.clientX + 'px';
        contactCursor.style.top  = e.clientY + 'px';

        /* "THE END" title leans toward the pointer */
        const nx = (e.clientX / window.innerWidth  - 0.5) * 2;
        const ny = (e.clientY / window.innerHeight - 0.5) * 2;
        finalTitle.style.transform =
          'rotate(' + (nx * 10).toFixed(2) + 'deg) translate(' +
          (nx * 14).toFixed(1) + 'px,' + (ny * 8).toFixed(1) + 'px)';
      });
    }

    /* ── Mobile: "THE END" title reacts to phone tilt (gyroscope) ── */
    if (isTouchDevice) {
      let tBeta = 0, tGamma = 0, tCB = 0, tCG = 0, tRaf = null;

      function tiltStep() {
        tCB += (tBeta  - tCB) * 0.08;
        tCG += (tGamma - tCG) * 0.08;
        finalTitle.style.transform =
          'rotate(' + (tCG * 0.4).toFixed(2) + 'deg) ' +
          'translate(' + (tCG * 6).toFixed(1) + 'px,' + (tCB * 3).toFixed(1) + 'px)';
        tRaf = (Math.abs(tBeta - tCB) + Math.abs(tGamma - tCG)) > 0.04
          ? requestAnimationFrame(tiltStep) : null;
      }

      function onTitleOrientation(e) {
        if (e.gamma == null) return;
        tBeta  = Math.max(-20, Math.min(20, (e.beta  || 0) - 80));
        tGamma = Math.max(-20, Math.min(20,  e.gamma || 0));
        if (!tRaf) tRaf = requestAnimationFrame(tiltStep);
      }

      function setupTitleGyro() {
        window.addEventListener('deviceorientation', onTitleOrientation, { passive: true });
      }

      if (typeof DeviceOrientationEvent !== 'undefined' &&
          typeof DeviceOrientationEvent.requestPermission === 'function') {
        // iOS 13+ — request on the exit button click (that IS a user gesture)
        exitBtn.addEventListener('click', () => {
          DeviceOrientationEvent.requestPermission()
            .then(r => { if (r === 'granted') setupTitleGyro(); })
            .catch(() => {});
        }, { once: true });
      } else if (typeof DeviceOrientationEvent !== 'undefined') {
        setupTitleGyro();
      }
    }

    /* ── Exit dive animation ── */
    let diving = false;
    exitBtn.addEventListener('click', () => {
      if (diving) return;
      diving = true;
      stage.classList.add('diving');
      setTimeout(() => {
        final.classList.add('show');
        final.setAttribute('aria-hidden', 'false');
        if (!isTouchDevice) contactCursor.classList.add('show');
      }, 1450);
    });

    /* ── Dream orb: safe-zone hover logic (desktop only) ──
       Safe zone = 3× the button's size in every direction.
       Moving out of the safe zone collapses the orb; returning reopens it. */
    let orbShown = false;
    let btnRect  = null;

    function showOrb() {
      if (orbShown) return;
      orbShown = true;
      dreamOrb.classList.remove('collapsing');
      /* Force reflow so removing 'collapsing' takes effect before re-adding 'show' */
      void dreamOrb.offsetWidth;
      dreamOrb.classList.add('show');
    }
    function hideOrb() {
      if (!orbShown) return;
      orbShown = false;
      dreamOrb.classList.add('collapsing');
      dreamOrb.classList.remove('show');
    }
    function inSafeZone(mx, my) {
      if (!btnRect) return false;
      const scale = 3.0;   /* 3× the button size */
      const cx = btnRect.left + btnRect.width  / 2;
      const cy = btnRect.top  + btnRect.height / 2;
      const hw = (btnRect.width  / 2) * scale;
      const hh = (btnRect.height / 2) * scale;
      return mx >= cx - hw && mx <= cx + hw && my >= cy - hh && my <= cy + hh;
    }

    if (!isTouchDevice) {
      reopenBtn.addEventListener('mouseenter', () => {
        /* Re-capture rect each time (in case window resized) */
        btnRect = reopenBtn.getBoundingClientRect();
        showOrb();
      });
      /* Only CLOSE the orb on mouse-move leaving the safe zone.
         Re-opening requires hovering the button directly — not just
         re-entering the safe zone. */
      document.addEventListener('mousemove', (e) => {
        if (!btnRect || !orbShown) return;
        if (!inSafeZone(e.clientX, e.clientY)) hideOrb();
      }, { passive: true });
    }

    reopenBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      window.location.replace('../../index.html');
    });

    /* ── WhatsApp button (visible on mobile only via CSS) ── */
    if (waBtn) {
      waBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        window.open(whatsappURL(), '_blank', 'noopener');
      });
    }

    /* ── Tap/click anywhere on final screen → WhatsApp ── */
    final.addEventListener('click', () => {
      if (!isTouchDevice) {
        contactCursor.classList.add('tap');
        setTimeout(() => contactCursor.classList.remove('tap'), 150);
      }
      window.open(whatsappURL(), '_blank', 'noopener');
    });
  </script>
</body>
</html>
